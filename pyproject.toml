[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "answer-leakage"
version = "0.1.0"
description = "Measure what answer-conditioned chains of thought do to a distillation corpus"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jungseob Lee" }]
keywords = ["chain-of-thought", "distillation", "reasoning", "data-quality"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Scoring a corpus needs nothing but the standard library. math_verify only
# matters when you re-run the correctness filter, and it is pinned there because
# a different version changes which chains survive it.
dependencies = []

[project.optional-dependencies]
verify = ["math-verify==0.9.0", "sympy==1.14.0"]
generate = ["vllm==0.15.1", "transformers==4.57.6"]

[project.urls]
Repository = "https://github.com/js-lee-AI/GLANCE"

[tool.setuptools.packages.find]
include = ["answer_leakage*"]
